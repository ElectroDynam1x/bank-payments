# Внешний балансировщик стенда (уровень TCP). В промышленной среде его роль
# выполняет сетевой балансировщик банка; TLS завершается на шлюзах кластера.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

stream {
    log_format tcp '$time_iso8601 $remote_addr -> $upstream_addr $status $session_time';
    access_log /dev/stdout tcp;

    upstream prod_gateways {            # шлюзы промышленного контура
        server 10.10.0.11:443 max_fails=1 fail_timeout=5s;
        server 10.10.0.12:443 max_fails=1 fail_timeout=5s;
    }
    upstream stage_gateways {           # шлюзы тестового контура
        server 10.10.0.11:8443 max_fails=1 fail_timeout=5s;
        server 10.10.0.12:8443 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 443;
        proxy_pass prod_gateways;
        proxy_connect_timeout 1s;
    }
    server {
        listen 8443;
        proxy_pass stage_gateways;
        proxy_connect_timeout 1s;
    }
}
