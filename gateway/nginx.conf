# Шлюз (точка входа): TLS, заголовки безопасности, ограничение частоты запросов
# к форме входа, балансировка между репликами по записям DNS кластера.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
        '"time":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Встроенный DNS Docker. Имя tasks.<сервис> возвращает адреса всех реплик;
    # при обновлении сервиса список адресов перечитывается каждые две секунды.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream api {
        zone api 64k;
        server tasks.backend:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    upstream web {
        zone web 64k;
        server tasks.frontend:8080 resolve max_fails=1 fail_timeout=5s;
    }

    # Защита от перебора паролей: не более 30 попыток входа в минуту с одного адреса
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:tls:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Если реплика недоступна, запрос передаётся следующей
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api;
        }

        location /api/ {
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://web;
        }
    }
}
