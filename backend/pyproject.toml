[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # Depends() в значениях по умолчанию – штатный приём FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
