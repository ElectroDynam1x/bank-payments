# Описание стека для Docker Swarm. Один файл используется для тестового и
# промышленного контуров; различия заданы переменными из deploy/env/<контур>.env.
#
# Развёртывание: deploy/scripts/deploy.sh <контур> <версия>

x-update-policy: &update-policy
  parallelism: 1            # обновляется по одной реплике
  delay: 10s                # пауза между репликами
  order: start-first        # сначала запускается новая реплика, затем останавливается старая
  monitor: 20s              # время наблюдения за новой репликой
  failure_action: rollback  # при сбое обновление автоматически откатывается
  max_failure_ratio: 0

x-rollback-policy: &rollback-policy
  parallelism: 1
  order: start-first
  monitor: 10s

services:
  gateway:
    image: ${REGISTRY}/bank/gateway:${VERSION}
    networks: [edge]
    ports:
      - target: 8443
        published: ${HTTPS_PORT}
        protocol: tcp
        mode: host            # порт открыт непосредственно на узле, перед узлами стоит балансировщик
    secrets:
      - source: tls_cert
        target: tls_cert
        uid: "101"
        gid: "101"
        mode: 0440
      - source: tls_key
        target: tls_key
        uid: "101"
        gid: "101"
        mode: 0400
    read_only: true           # корневая файловая система контейнера только для чтения
    volumes:
      - type: tmpfs
        target: /tmp
    deploy:
      mode: global
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.edge == true]
      update_config:
        parallelism: 1
        delay: 15s
        order: stop-first     # порт узла занят старым экземпляром, поэтому сначала остановка
        monitor: 15s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits: {cpus: "0.50", memory: 128M}
        reservations: {memory: 32M}

  frontend:
    image: ${REGISTRY}/bank/frontend:${VERSION}
    networks: [edge]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
    deploy:
      replicas: ${FRONTEND_REPLICAS}
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.app == true]
        preferences:
          - spread: node.id
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}

  backend:
    image: ${REGISTRY}/bank/backend:${VERSION}
    networks: [edge, data]
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: db
      DB_NAME: bank
      DB_USER: bank
      SEED_DEMO_DATA: "1"     # стенд заполняется тестовыми данными
    secrets: [db_password, jwt_secret, demo_password]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
    stop_grace_period: 30s    # время на завершение текущих запросов
    deploy:
      replicas: ${BACKEND_REPLICAS}
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.app == true]
        preferences:
          - spread: node.id
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      resources:
        limits: {cpus: "0.75", memory: 256M}
        reservations: {memory: 96M}

  db:
    image: ${REGISTRY}/mirror/postgres:17-alpine
    networks: [data]
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.db == true]   # данные лежат в томе конкретного узла
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits: {cpus: "1.00", memory: 512M}
        reservations: {memory: 128M}

networks:
  edge:                       # шлюз, клиентская и серверная части
    driver: overlay
  data:                       # серверная часть и СУБД, без выхода во внешние сети
    driver: overlay
    internal: true

volumes:
  pgdata:

secrets:                      # создаются администратором заранее, в репозитории не хранятся
  db_password:
    external: true
    name: ${STACK}_db_password
  jwt_secret:
    external: true
    name: ${STACK}_jwt_secret
  demo_password:
    external: true
    name: ${STACK}_demo_password
  tls_cert:
    external: true
    name: ${STACK}_tls_cert
  tls_key:
    external: true
    name: ${STACK}_tls_key
